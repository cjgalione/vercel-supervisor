name: Daily supervisor smoke
on:
  schedule:
    - cron: "28 6 * * *"
  workflow_dispatch:
    inputs:
      num_questions:
        description: "Number of questions to generate for this manual run"
        required: false
        default: "100"

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-supervisor-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Validate required secrets
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          BRAINTRUST_PROJECT: "vercel-ai-sdk-supervisor"
          BRAINTRUST_ORG_NAME: "Braintrust Demos"
          BRAINTRUST_GATEWAY_URL: "https://gateway.braintrust.dev"
          SEARCH_PROVIDER: "exa"
          CONCURRENCY: "1"
          MAX_RETRIES: "3"
          BASE_RETRY_SECONDS: "15"
          INTER_QUESTION_DELAY_SECONDS: "2"
          TRACE_PROFILE: "lean"
          REQUIRE_BRAINTRUST: "1"
        run: |
          missing=0
          for name in BRAINTRUST_API_KEY EXA_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Preflight providers
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          BRAINTRUST_PROJECT: "vercel-ai-sdk-supervisor"
          BRAINTRUST_ORG_NAME: "Braintrust Demos"
          BRAINTRUST_GATEWAY_URL: "https://gateway.braintrust.dev"
          SEARCH_PROVIDER: "exa"
          CONCURRENCY: "1"
          MAX_RETRIES: "3"
          BASE_RETRY_SECONDS: "15"
          INTER_QUESTION_DELAY_SECONDS: "2"
          TRACE_PROFILE: "lean"
          REQUIRE_BRAINTRUST: "1"
          QUERY_SUMMARY_PATH: daily-summary.json
        run: |
          npm run run:queries -- --preflight-only --require-braintrust || { printf '{"preflight":{"status":"failed"}}\n' > daily-summary.json; exit 1; }

      - name: Run queries
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          BRAINTRUST_PROJECT: "vercel-ai-sdk-supervisor"
          BRAINTRUST_ORG_NAME: "Braintrust Demos"
          BRAINTRUST_GATEWAY_URL: "https://gateway.braintrust.dev"
          SEARCH_PROVIDER: "exa"
          CONCURRENCY: "1"
          MAX_RETRIES: "3"
          BASE_RETRY_SECONDS: "15"
          INTER_QUESTION_DELAY_SECONDS: "2"
          TRACE_PROFILE: "lean"
          REQUIRE_BRAINTRUST: "1"
          NUM_QUESTIONS: ${{ github.event_name == 'schedule' && '10' || github.event.inputs.num_questions || '100' }}
          QUERY_SUMMARY_PATH: daily-summary.json
        run: |
          npm run run:queries -- --num-questions "$NUM_QUESTIONS" --question-source bank --seed 0 --skip-preflight --fail-on-error --require-braintrust

      - name: Upload daily summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-supervisor-summary
          path: daily-summary.json
          if-no-files-found: warn

  notify-failure:
    needs: run-queries
    if: ${{ always() && github.event_name == 'schedule' && needs.run-queries.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'daily-run-failure';
            const title = 'Daily supervisor smoke is failing';
            const body = `Scheduled run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            if (!labels.some((item) => item.name === label)) {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'b60205' });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = issues.find((item) => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
            }

  notify-recovery:
    needs: run-queries
    if: ${{ always() && github.event_name == 'schedule' && needs.run-queries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'daily-run-failure';
            const title = 'Daily supervisor smoke is failing';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 100,
            });
            for (const issue of issues.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Recovered: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }
