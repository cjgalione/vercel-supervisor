name: Daily modal queries
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      num_questions:
        description: "Number of questions to generate for this manual run"
        required: false
        default: "100"

jobs:
  run-queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run queries
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: vercel-ai-sdk-supervisor
          BRAINTRUST_ORG_NAME: Braintrust Demos
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NUM_QUESTIONS: ${{ github.event.inputs.num_questions || '100' }}
          CONCURRENCY: 1
          MAX_RETRIES: 3
          BASE_RETRY_SECONDS: 15
          INTER_QUESTION_DELAY_SECONDS: 2
          REQUIRE_BRAINTRUST: 1
          TRACE_PROFILE: lean
        run: npm run run:queries -- --num-questions "$NUM_QUESTIONS" --fail-on-error --require-braintrust
